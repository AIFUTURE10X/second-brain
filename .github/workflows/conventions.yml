name: Conventions

on:
  push:
  pull_request:

jobs:
  conventions:
    name: Conventions check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Zero-dependency script — no npm install needed
      - run: node scripts/check-conventions.mjs
