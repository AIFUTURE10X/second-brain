<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0D0F12;
      color: #E0E0E0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #E8A838, #EB5757);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .setup { display: none; }
    .setup.show { display: block; }
    .main { display: none; }
    .main.show { display: block; }
    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      font-family: monospace;
    }
    .hint {
      font-size: 10px;
      color: #555;
      margin-bottom: 8px;
      font-family: monospace;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px 10px;
      background: #181B21;
      border: 1px solid #252830;
      border-radius: 8px;
      color: #ccc;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    input::placeholder, textarea::placeholder {
      color: #666;
    }
    input:focus, textarea:focus { border-color: #E8A83860; }
    textarea { resize: vertical; min-height: 50px; font-family: inherit; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .types { display: flex; gap: 4px; margin-bottom: 10px; }
    .types button {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #252830;
      background: #181B21;
      color: #666;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
      transition: all 0.15s;
    }
    .types button:hover {
      border-color: #E8A83840;
      color: #999;
    }
    .types button.active {
      border-color: #E8A83860;
      background: #E8A83815;
      color: #E8A838;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #E8A838, #EB5757);
      transition: transform 0.1s;
    }
    .btn:hover { transform: scale(1.01); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; transform: none; }
    .btn-secondary {
      background: #181B21;
      border: 1px solid #252830;
      color: #888;
      margin-top: 6px;
    }
    .btn-secondary:hover { color: #ccc; border-color: #353840; }
    .status {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      font-family: monospace;
      line-height: 1.4;
    }
    .status.ok { color: #6FCF97; }
    .status.err { color: #EB5757; }
    .url-preview {
      font-size: 12px;
      color: #5B8DEF;
      font-family: monospace;
      margin-bottom: 10px;
      word-break: break-all;
      line-height: 1.3;
      padding: 6px 8px;
      background: #5B8DEF08;
      border: 1px solid #5B8DEF20;
      border-radius: 6px;
    }
    .setup-error {
      font-size: 11px;
      color: #EB5757;
      margin-bottom: 8px;
      font-family: monospace;
      display: none;
    }
    .setup-error.show { display: block; }
  </style>
</head>
<body>
  <h1>◆ Second Brain</h1>

  <!-- Setup screen -->
  <div class="setup" id="setup">
    <label>Your Second Brain URL</label>
    <input id="hostInput" placeholder="https://your-app.vercel.app" />
    <div class="hint">The URL where your Second Brain app is hosted</div>
    <label>API Key</label>
    <input id="keyInput" placeholder="Your API_SECRET value" type="password" />
    <div class="hint">Set as API_SECRET in your environment variables</div>
    <div class="setup-error" id="setupError"></div>
    <button class="btn" id="connectBtn">Connect</button>
  </div>

  <!-- Main screen -->
  <div class="main" id="main">
    <div class="url-preview" id="urlPreview"></div>

    <div class="types" id="typeButtons">
      <button data-type="link" class="active">◈ Link</button>
      <button data-type="clip">✂ Clip</button>
      <button data-type="note">✎ Note</button>
      <button data-type="thought">◉ Thought</button>
    </div>

    <input id="titleInput" placeholder="Title (auto-filled from page)" />
    <textarea id="notesInput" placeholder="My notes on this..." rows="2"></textarea>
    <div class="row">
      <input id="tagsInput" placeholder="e.g. python, tutorial" />
      <input id="categoryInput" placeholder="Category (optional)" />
    </div>

    <button class="btn" id="saveBtn">Save to Brain</button>
    <button class="btn btn-secondary" id="settingsBtn">Settings</button>

    <div class="status" id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
